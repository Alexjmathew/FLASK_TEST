<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Price Predictor</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem 1rem; }
    .card { max-width: 420px; margin: auto; background: #fff; padding: 2rem; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 1rem 0 .3rem; font-size: .9rem; color: #444; }
    input { width: 100%; padding: .6rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 1.5rem; padding: .8rem; border: 0; border-radius: 6px;
             background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 1.5rem; padding: 1rem; background: #ecfdf5; border-radius: 6px;
              text-align: center; font-size: 1.3rem; color: #065f46; }
    .error { margin-top: 1.5rem; padding: 1rem; background: #fef2f2; border-radius: 6px; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏠 House Price Predictor</h1>
    <form method="post" action="/predict">
      <label>Area (sq ft)</label>
      <input type="number" name="area_sqft" value="{{ form.get('area_sqft', '') }}" required>
      <label>Bedrooms</label>
      <input type="number" name="bedrooms" value="{{ form.get('bedrooms', '') }}" required>
      <label>Bathrooms</label>
      <input type="number" name="bathrooms" value="{{ form.get('bathrooms', '') }}" required>
      <label>Age of house (years)</label>
      <input type="number" name="age_years" value="{{ form.get('age_years', '') }}" required>
      <button type="submit">Predict Price</button>
    </form>
    {% if prediction %}<div class="result">Estimated price: ${{ prediction }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
